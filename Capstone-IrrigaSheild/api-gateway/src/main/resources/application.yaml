server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
        pool:
          type: ELASTIC
          max-idle-time: 15s
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth,/api/auth/**,/api/users,/api/users/**,/api/admin/users,/api/admin/users/**

            - id: farm-service
              uri: lb://FARM-SERVICE
              predicates:
                - Path=/api/farmers,/api/farmers/**,/api/farms,/api/farms/**

            - id: policy-service
              uri: lb://POLICY-SERVICE
              predicates:
                - Path=/api/plans,/api/plans/**,/api/applications,/api/applications/**,/api/policies,/api/policies/**,/api/internal/policies/**,/api/admin/plans,/api/admin/plans/**,/api/admin/trigger-rules/**,/api/underwriting,/api/underwriting/**

            - id: event-claims-service
              uri: lb://EVENT-CLAIMS-SERVICE
              predicates:
                - Path=/api/readings,/api/readings/**,/api/claims,/api/claims/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

security:
  jwt:
    secret: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

  cookie:
    name: "IRRIGASHIELD_TOKEN"
