spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/irrigashield_event_claims_test_db?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:root}

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations:
        - classpath:schema.sql

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false