spring:
  application:
    name: event-claims-service

  r2dbc:
    url: r2dbc:mysql://localhost:3306/irrigashield_event_claims_db?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:root}

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations:
        - classpath:schema.sql

server:
  port: 8084

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    ip-address: 127.0.0.1
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always

info:
  application:
    name: IrrigaShield Event Claims Service
    description: Irrigation event and claim processing service
    version: 1.0.0

logging:
  level:
    root: INFO
    org.example.eventclaimsservice: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
