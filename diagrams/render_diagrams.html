<!-- ==================== 1. ARCHITECTURE DIAGRAM ==================== -->

    <!-- CLIENT (ANGULAR) -->

    <!-- Spring Cloud Gateway Box -->

    <text x="710" y="400" fill="#e0e0e0" font-size="12.5" font-weight="600" text-anchor="middle">Heartbeat and Discovery</text>

    <!-- Arrow Routing Container -> Microservices Container -->
    <path d="M 335 336 L 335 364 L 355 364 L 355 390" stroke="#e5e5e5" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

    <!-- MICROSERVICES CONTAINER -->

    <!-- 1. Auth Service -->

    <!-- 4. Policy Service -->

    <text x="281" y="585" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Policy Service</text>

    <!-- 5. Underwriting Module / Service -->
    <rect x="405" y="555" width="142" height="50" rx="8" ry="8" stroke="#ffffff" stroke-width="1.5" fill="#262626"/>
    <text x="476" y="577" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Underwriting</text>
    <text x="476" y="594" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Risk Engine</text>

    <!-- Inter-service orthogonal connectors (matching Photo 1 exact style) -->

    <path d="M 310 475 L 310 518 L 281 518 L 281 555" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <!-- Policy Service <-> Underwriting Engine -->
    <path d="M 347 580 L 405 580" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <!-- Underwriting Engine -> Farm Service (Risk Profile) -->
    <path d="M 476 555 L 476 518 L 510 518 L 510 506" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <path d="M 325 555 L 325 532 L 492 532 L 492 506" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(840, 535)">
      <rect x="0" y="0" width="74" height="70" rx="6" fill="#d93829" stroke="#ff6b5b" stroke-width="1.5"/>
      <circle cx="37" cy="27" r="13" stroke="#ffffff" stroke-width="2" fill="none"/>
      <circle cx="37" cy="27" r="4.5" fill="#ffffff"/>

      <path d="M 18 58 Q 27.5 50 37 58 T 56 58" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    </g>
    <text x="877" y="624" fill="#e0e0e0" font-size="12" font-weight="600" text-anchor="middle">IoT Telemetry</text>
    <text x="877" y="640" fill="#e0e0e0" font-size="12" font-weight="600" text-anchor="middle">Feed</text>

    <!-- Line from Event Claims Service <-> IoT Telemetry -->
    <path d="M 396 432 L 660 432 L 660 570 L 838 570" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="676" y="558" width="146" height="22" fill="#1c1c1c"/>
    <text x="749" y="573" fill="#e0e0e0" font-size="12" font-weight="600" text-anchor="middle">Water Telemetry Data</text>

    <!-- BOTTOM ROW: DATABASES (Cylinders matching Photo 1) -->
    <!-- 1. Auth DB -->
    <path d="M 142 508 L 142 752" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(104, 756)">
      <path d="M 0 14 L 0 74 A 38 14 0 0 0 76 74 L 76 14" fill="url(#dbGrad)" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="38" ry="14" fill="#383838" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="30" ry="9" fill="none" stroke="#888888" stroke-width="1"/>
      <text x="38" y="52" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">Auth DB</text>
    </g>

    <!-- 2. Claims DB -->
    <path d="M 278 475 L 278 522 L 195 522 L 195 712 L 266 712 L 266 752" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(228, 756)">
      <path d="M 0 14 L 0 74 A 38 14 0 0 0 76 74 L 76 14" fill="url(#dbGrad)" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="38" ry="14" fill="#383838" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="30" ry="9" fill="none" stroke="#888888" stroke-width="1"/>
      <text x="38" y="46" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">Claims</text>
      <text x="38" y="62" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">db</text>
    </g>

    <!-- 3. Policy DB -->
    <path d="M 281 605 L 281 695 L 390 695 L 390 752" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(352, 756)">
      <path d="M 0 14 L 0 74 A 38 14 0 0 0 76 74 L 76 14" fill="url(#dbGrad)" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="38" ry="14" fill="#383838" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="30" ry="9" fill="none" stroke="#888888" stroke-width="1"/>
      <text x="38" y="52" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">Policy db</text>
    </g>

    <!-- 4. Underwriting DB / Schema -->
    <path d="M 476 605 L 476 695 L 514 695 L 514 752" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(476, 756)">
      <path d="M 0 14 L 0 74 A 38 14 0 0 0 76 74 L 76 14" fill="url(#dbGrad)" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="38" ry="14" fill="#383838" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="30" ry="9" fill="none" stroke="#888888" stroke-width="1"/>
      <text x="38" y="46" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Underwriting</text>
      <text x="38" y="62" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">db</text>
    </g>

    <!-- 5. Farm DB -->
    <path d="M 565 506 L 565 695 L 638 695 L 638 752" stroke="#e5e5e5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(600, 756)">
      <path d="M 0 14 L 0 74 A 38 14 0 0 0 76 74 L 76 14" fill="url(#dbGrad)" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="38" ry="14" fill="#383838" stroke="#d8d8d8" stroke-width="1.5"/>
      <ellipse cx="38" cy="14" rx="30" ry="9" fill="none" stroke="#888888" stroke-width="1"/>
      <text x="38" y="52" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">Farm db</text>
    </g>
  </svg>
</div>

<!-- ==================== 2. POLICY LIFECYCLE DIAGRAM (Exact Photo 2 Style) ==================== -->
<div id="policy-diagram" class="diagram-wrapper" style="width: 920px; height: 980px; background: #1c1c1c;">
  <svg width="824" height="908" viewBox="0 0 824 908" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="blue-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#7aa8d6"/>
      </marker>
      <style>
        .state-box { fill: #2b3545; stroke: #7aa8d6; stroke-width: 1.8; }
        .state-text { fill: #ffffff; font-size: 14px; font-weight: 700; font-family: 'Segoe UI', sans-serif; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0.4px; }
        .edge-path { stroke: #7aa8d6; stroke-width: 1.8; fill: none; marker-end: url(#blue-arrow); }
        .edge-label-bg { fill: #1c1c1c; opacity: 0.92; }
        .edge-label { fill: #ffffff; font-size: 13px; font-weight: 600; font-family: 'Segoe UI', sans-serif; text-anchor: middle; }
      </style>
    </defs>

    <!-- Start Node -->
    <circle cx="330" cy="30" r="10" fill="#7aa8d6" stroke="#9ec3e8" stroke-width="2"/>
    <path d="M 330 40 L 330 98" class="edge-path"/>

    <!-- DRAFT -->
    <rect x="285" y="100" width="90" height="44" rx="7" class="state-box"/>
    <text x="330" y="123" class="state-text">DRAFT</text>

    <!-- DRAFT -> SUBMITTED -->
    <path d="M 330 144 L 330 222" class="edge-path"/>
    <rect x="295" y="172" width="70" height="22" class="edge-label-bg"/>
    <text x="330" y="188" class="edge-label">submit</text>

    <!-- SUBMITTED -->
    <rect x="272" y="224" width="116" height="44" rx="7" class="state-box"/>
    <text x="330" y="247" class="state-text">SUBMITTED</text>

    <!-- SUBMITTED -> UNDER_REVIEW -->
    <path d="M 365 268 C 395 292, 418 312, 425 344" class="edge-path"/>
    <rect x="355" y="294" width="96" height="22" class="edge-label-bg"/>
    <text x="403" y="310" class="edge-label">start review</text>

    <!-- UNDER_REVIEW -->
    <rect x="355" y="346" width="142" height="44" rx="7" class="state-box"/>
    <text x="426" y="369" class="state-text">UNDER_REVIEW</text>

    <!-- UNDER_REVIEW -> INFO_REQUESTED (left branch) -->
    <path d="M 382 390 C 345 418, 295 438, 268 468" class="edge-path"/>
    <rect x="248" y="418" width="150" height="22" class="edge-label-bg"/>
    <text x="323" y="434" class="edge-label">request information</text>

    <!-- INFO_REQUESTED -->
    <rect x="165" y="470" width="175" height="44" rx="7" class="state-box"/>
    <text x="252" y="493" class="state-text">INFO_REQUESTED</text>

    <!-- INFO_REQUESTED -> SUBMITTED (curve back up on left) -->
    <path d="M 225 470 C 175 405, 195 310, 275 268" class="edge-path"/>
    <rect x="122" y="352" width="166" height="22" class="edge-label-bg"/>
    <text x="205" y="368" class="edge-label">submit additional info</text>

    <!-- UNDER_REVIEW -> APPROVED_PENDING_PREMIUM (right branch) -->
    <path d="M 480 390 C 535 415, 580 438, 600 468" class="edge-path"/>
    <rect x="505" y="418" width="95" height="22" class="edge-label-bg"/>
    <text x="552" y="434" class="edge-label">approve</text>

    <!-- APPROVED_PENDING_PREMIUM -->
    <rect x="468" y="470" width="265" height="44" rx="7" class="state-box"/>
    <text x="600" y="493" class="state-text">APPROVED_PENDING_PREMIUM</text>

    <!-- APPROVED_PENDING_PREMIUM -> PREMIUM_QUOTED -->
    <path d="M 600 514 L 600 592" class="edge-path"/>
    <rect x="545" y="542" width="110" height="22" class="edge-label-bg"/>
    <text x="600" y="558" class="edge-label">set premium</text>

    <!-- PREMIUM_QUOTED -->
    <rect x="515" y="594" width="170" height="44" rx="7" class="state-box"/>
    <text x="600" y="617" class="state-text">PREMIUM_QUOTED</text>

    <!-- PREMIUM_QUOTED -> PREMIUM_ACCEPTED -->
    <path d="M 600 638 L 600 714" class="edge-path"/>
    <rect x="535" y="665" width="130" height="22" class="edge-label-bg"/>
    <text x="600" y="681" class="edge-label">accept premium</text>

    <!-- PREMIUM_ACCEPTED -->
    <rect x="508" y="716" width="184" height="44" rx="7" class="state-box"/>
    <text x="600" y="739" class="state-text">PREMIUM_ACCEPTED</text>

    <!-- PREMIUM_ACCEPTED -> POLICY_ACTIVE -->
    <path d="M 600 760 L 600 822" class="edge-path"/>
    <rect x="535" y="780" width="130" height="22" class="edge-label-bg"/>
    <text x="600" y="796" class="edge-label">payment success</text>

    <!-- POLICY_ACTIVE -->
    <rect x="528" y="824" width="144" height="42" rx="7" class="state-box"/>
    <text x="600" y="846" class="state-text">POLICY_ACTIVE</text>

    <!-- UNDER_REVIEW -> REJECTED (straight vertical line down center) -->
    <path d="M 426 390 L 426 822" class="edge-path"/>
    <rect x="396" y="594" width="60" height="22" class="edge-label-bg"/>
    <text x="426" y="610" class="edge-label">reject</text>

    <!-- REJECTED -->
    <rect x="376" y="824" width="100" height="42" rx="7" class="state-box"/>
    <text x="426" y="846" class="state-text">REJECTED</text>

    <!-- End Node [*] -->
    <circle cx="555" cy="894" r="10" fill="none" stroke="#7aa8d6" stroke-width="2"/>
    <circle cx="555" cy="894" r="5" fill="#7aa8d6"/>

    <!-- REJECTED -> [*] and POLICY_ACTIVE -> [*] -->
    <path d="M 426 866 C 445 885, 505 892, 543 894" class="edge-path"/>
    <path d="M 600 866 C 590 882, 575 889, 567 893" class="edge-path"/>
  </svg>
</div>

<!-- ==================== 3. CLAIMS LIFECYCLE DIAGRAM (Exact Photo 3 Style) ==================== -->
<div id="claims-diagram" class="diagram-wrapper" style="width: 1020px; height: 760px; background: #1c1c1c;">
  <svg width="924" height="688" viewBox="0 0 924 688" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="blue-arrow-2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M 0 1 L 9 5 L 0 9 z" fill="#7aa8d6"/>
      </marker>
      <style>
        .c-box { fill: #2b3545; stroke: #7aa8d6; stroke-width: 1.8; }

    <text x="250" y="408" class="c-label">approve / finalize settlement</text>

    <!-- APPROVED -->
    <rect x="102" y="438" width="114" height="44" rx="7" class="c-box"/>
    <text x="159" y="461" class="c-text">APPROVED</text>

    <!-- APPROVED -> SETTLED -->
    <path d="M 159 482 L 159 558" class="c-edge"/>

    <path d="M 390 244 C 350 325, 360 480, 428 558" class="c-edge"/>
    <rect x="352" y="425" width="52" height="22" class="c-bg"/>
    <text x="378" y="441" class="c-label">reject</text>

    <!-- UNDER_REVIEW -> REJECTED (straight vertical down center like Photo 3) -->
    <path d="M 482 356 L 482 558" class="c-edge"/>
    <rect x="456" y="445" width="52" height="22" class="c-bg"/>
    <text x="482" y="461" class="c-label">reject</text>

    <!-- SUBMITTED -> INFO_REQUESTED (right outer curve like Photo 3) -->
    <path d="M 468 226 C 595 248, 675 315, 725 436" class="c-edge"/>
    <rect x="572" y="318" width="150" height="22" class="c-bg"/>
    <text x="647" y="334" class="c-label">request information</text>

    <!-- UNDER_REVIEW -> INFO_REQUESTED (right inner curve like Photo 3) -->
    <path d="M 554 342 C 625 362, 680 395, 712 436" class="c-edge"/>
    <rect x="615" y="392" width="146" height="22" class="c-bg"/>
    <text x="688" y="408" class="c-label">request information</text>

    <!-- INFO_REQUESTED -->
    <rect x="645" y="438" width="165" height="44" rx="7" class="c-box"/>
    <text x="727" y="461" class="c-text">INFO_REQUESTED</text>

    <!-- Loop on right (submit additional documents -> UNDER_REVIEW) -->
